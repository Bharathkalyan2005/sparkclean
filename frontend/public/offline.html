<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" 
    content="width=device-width, initial-scale=1.0"/>
  <title>SuciHome — Offline</title>
  <style>
    body {
      font-family : 'Inter', sans-serif;
      background  : #F5F0E8;
      min-height  : 100vh;
      display     : flex;
      align-items : center;
      justify-content: center;
      flex-direction : column;
      gap         : 16px;
      text-align  : center;
      padding     : 24px;
      margin      : 0;
    }
    img  { height: 72px; }
    h1   { color: #1B4332; font-size: 24px; margin: 0; }
    p    { color: #5C6B5E; font-size: 15px; margin: 0; }
    button {
      background  : #1B4332;
      color       : #FFFFFF;
      border      : none;
      padding     : 14px 32px;
      border-radius: 50px;
      font-size   : 15px;
      font-weight : 700;
      cursor      : pointer;
      margin-top  : 8px;
    }
  </style>
</head>
<body>
  <img src="/logo.png" alt="SuciHome" />
  <h1>You're offline</h1>
  <p>No internet connection.<br/>
     Please check your connection and try again.</p>
  <button onclick="window.location.reload()">
    Try Again
  </button>
  <p style="font-size:13px; margin-top:8px">
    📞 Call us: 9392420643
  </p>
</body>
</html>
